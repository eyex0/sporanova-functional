services:
  - type: web
    name: sopranova-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    preDeployCommand: npx drizzle-kit push
    healthCheckPath: /api/trpc/system.health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        value: https://public-hkdyhg20b-eyex.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
        size: 48
      - key: SUPABASE_URL
        value: https://fuiuzmseqznzjjnefaep.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-5-mini
      - key: EMAIL_API_KEY
        sync: false
