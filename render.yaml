services:
  - type: web
    name: sopranova-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/trpc/system.health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        value: https://sopranova-api.onrender.com
      - key: APP_URL
        value: https://sopranova-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
        size: 48
      - key: SESSION_DAYS
        value: "14"
      - key: SUPABASE_URL
        value: https://fuiuzmseqznzjjnefaep.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-4o
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "SOPRANOVA <noreply@sopranova.com>"
      - key: EMAIL_API_KEY
        sync: false
